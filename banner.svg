<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="1200" height="380" role="img" aria-label="Hi, I'm SV Krishnavarshini, a first-year CSE student">
  <defs>
    <linearGradient id="name" x1="0" x2="1" y1="0" y2="0" spreadMethod="reflect">
      <stop offset="0" stop-color="#8b5cf6"/>
      <stop offset=".5" stop-color="#ec4899"/>
      <stop offset="1" stop-color="#38bdf8"/>
      <animateTransform attributeName="gradientTransform" type="translate" from="0 0" to="2 0" dur="7s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="blob" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8b5cf6"/>
      <stop offset=".6" stop-color="#ec4899"/>
      <stop offset="1" stop-color="#38bdf8"/>
    </linearGradient>
    <filter id="blur" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="60"/></filter>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#fff" stroke-opacity=".04"/>
    </pattern>
    <clipPath id="card"><rect width="1200" height="380" rx="28"/></clipPath>
    <clipPath id="type">
      <rect x="70" y="226" width="0" height="44">
        <animate attributeName="width" values="0;384;384;0" keyTimes="0;0.4;0.82;1" dur="3s" repeatCount="indefinite"/>
      </rect>
    </clipPath>
    <path id="star" d="M0-9 2-2 9 0 2 2 0 9-2 2-9 0-2-2Z"/>
  </defs>

  <g clip-path="url(#card)" font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif">
    <rect width="1200" height="380" fill="#0b0b12"/>
    <circle cx="120" cy="10" r="220" fill="#8b5cf6" opacity=".45" filter="url(#blur)">
      <animate attributeName="cx" values="120;280;120" dur="14s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1120" cy="400" r="240" fill="#ec4899" opacity=".35" filter="url(#blur)">
      <animate attributeName="cy" values="400;300;400" dur="16s" repeatCount="indefinite"/>
    </circle>
    <circle cx="640" cy="430" r="170" fill="#38bdf8" opacity=".2" filter="url(#blur)">
      <animate attributeName="cx" values="640;520;640" dur="18s" repeatCount="indefinite"/>
    </circle>
    <rect width="1200" height="380" fill="url(#grid)"/>

    <!-- Text -->
    <text x="70" y="72" font-size="15" font-weight="700" letter-spacing="4" fill="#8b5cf6">WELCOME TO MY PROFILE</text>
    <text x="70" y="128" font-size="40" font-weight="700" fill="#f3f2f8">Hi, I'm</text>
    <text x="68" y="200" font-size="66" font-weight="800" fill="url(#name)">SV Krishnavarshini</text>

    <g clip-path="url(#type)" font-family="Consolas, 'Courier New', monospace" font-size="26" font-weight="700" fill="#38bdf8">
      <text x="70" y="256" textLength="374" lengthAdjust="spacingAndGlyphs">&gt; first-year CSE student
        <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.333;0.334;1" dur="9s" repeatCount="indefinite"/>
      </text>
      <text x="70" y="256" textLength="374" lengthAdjust="spacingAndGlyphs" opacity="0">&gt; aspiring web developer
        <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.333;0.334;0.666;0.667;1" dur="9s" repeatCount="indefinite"/>
      </text>
      <text x="70" y="256" textLength="374" lengthAdjust="spacingAndGlyphs" opacity="0">&gt; curious, always coding
        <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.666;0.667;1" dur="9s" repeatCount="indefinite"/>
      </text>
    </g>
    <rect x="72" y="231" width="3" height="32" fill="#ec4899">
      <animate attributeName="x" values="72;456;456;72" keyTimes="0;0.4;0.82;1" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;0;1" dur=".9s" repeatCount="indefinite"/>
    </rect>

    <!-- Chips -->
    <g font-size="15" font-weight="600" fill="#f3f2f8">
      <g>
        <animateTransform attributeName="transform" type="translate" values="0 0;0 -5;0 0" dur="4s" repeatCount="indefinite"/>
        <rect x="70" y="296" width="94" height="36" rx="18" fill="#fff" fill-opacity=".06" stroke="#fff" stroke-opacity=".14"/>
        <text x="117" y="319" text-anchor="middle">B.E. CSE</text>
      </g>
      <g>
        <animateTransform attributeName="transform" type="translate" values="0 0;0 -5;0 0" dur="4s" begin="-1.3s" repeatCount="indefinite"/>
        <rect x="176" y="296" width="300" height="36" rx="18" fill="#fff" fill-opacity=".06" stroke="#fff" stroke-opacity=".14"/>
        <text x="326" y="319" text-anchor="middle">SRM Valliammai Engineering College</text>
      </g>
      <g>
        <animateTransform attributeName="transform" type="translate" values="0 0;0 -5;0 0" dur="4s" begin="-2.6s" repeatCount="indefinite"/>
        <rect x="488" y="296" width="122" height="36" rx="18" fill="#fff" fill-opacity=".06" stroke="#fff" stroke-opacity=".14"/>
        <text x="549" y="319" text-anchor="middle">2026 – 2030</text>
      </g>
    </g>

    <!-- Cat stage -->
    <circle cx="990" cy="196" r="138" fill="url(#blob)"/>
    <g fill="none" stroke="#fff" stroke-opacity=".16" stroke-dasharray="4 7">
      <circle cx="990" cy="196" r="162"/>
      <animateTransform attributeName="transform" type="rotate" from="0 990 196" to="360 990 196" dur="30s" repeatCount="indefinite"/>
    </g>
    <g>
      <circle cx="990" cy="34" r="6" fill="#38bdf8"/>
      <animateTransform attributeName="transform" type="rotate" from="0 990 196" to="360 990 196" dur="12s" repeatCount="indefinite"/>
    </g>
    <g>
      <circle cx="990" cy="358" r="5" fill="#ec4899"/>
      <animateTransform attributeName="transform" type="rotate" from="360 990 196" to="0 990 196" dur="18s" repeatCount="indefinite"/>
    </g>

    <g fill="#fbbf24">
      <use href="#star" x="838" y="92"><animate attributeName="opacity" values=".3;1;.3" dur="2.2s" repeatCount="indefinite"/></use>
      <use href="#star" x="1136" y="118"><animate attributeName="opacity" values="1;.3;1" dur="2.6s" repeatCount="indefinite"/></use>
      <use href="#star" x="760" y="250" fill="#fff"><animate attributeName="opacity" values=".2;.9;.2" dur="3s" repeatCount="indefinite"/></use>
      <use href="#star" x="700" y="70" fill="#fff"><animate attributeName="opacity" values=".8;.2;.8" dur="2.8s" repeatCount="indefinite"/></use>
    </g>

    <svg x="836" y="50" width="308" height="308" viewBox="0 0 300 300" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <g>
        <animateTransform attributeName="transform" type="rotate" values="0 96 282;12 96 282;0 96 282" dur="3s" repeatCount="indefinite"/>
        <path d="M96 282C52 282 40 232 64 212" stroke="#1b1530" stroke-width="22"/>
        <path d="M96 282C52 282 40 232 64 212" stroke="#fff4e6" stroke-width="16"/>
      </g>

      <path d="M84 300C84 228 108 192 150 192s66 36 66 108Z" fill="#fff4e6" stroke="#1b1530" stroke-width="3"/>

      <g>
        <animateTransform attributeName="transform" type="rotate" values="0 212 232;-16 212 232;10 212 232;-16 212 232;0 212 232;0 212 232" keyTimes="0;0.12;0.25;0.38;0.55;1" dur="2.6s" repeatCount="indefinite"/>
        <path d="M212 232 240 182" stroke="#1b1530" stroke-width="25"/>
        <path d="M212 232 240 182" stroke="#fff4e6" stroke-width="19"/>
        <circle cx="243" cy="172" r="14" fill="#fff4e6" stroke="#1b1530" stroke-width="3"/>
        <circle cx="243" cy="174" r="4.500" fill="#f9a8d4"/>
        <circle cx="236" cy="166" r="2.200" fill="#f9a8d4"/>
        <circle cx="243" cy="163" r="2.200" fill="#f9a8d4"/>
        <circle cx="250" cy="166" r="2.200" fill="#f9a8d4"/>
      </g>

      <g transform="translate(0 12)">
        <g>
          <animateTransform attributeName="transform" type="translate" values="0 0;0 -4;0 0" dur="3.2s" repeatCount="indefinite"/>
          <path d="M104 100 96 46l46 26Z" fill="#fff4e6" stroke="#1b1530" stroke-width="3"/>
          <path d="M196 100l8-54-46 26Z" fill="#fff4e6" stroke="#1b1530" stroke-width="3"/>
          <path d="M110 88l-4-26 22 13Z" fill="#f9a8d4"/>
          <path d="M190 88l4-26-22 13Z" fill="#f9a8d4"/>
          <ellipse cx="150" cy="128" rx="60" ry="50" fill="#fff4e6" stroke="#1b1530" stroke-width="3"/>
          <path d="M150 82v11M139 84l2 9M161 84l-2 9" stroke="#fbbf24" stroke-width="4"/>
          <ellipse cx="127" cy="126" rx="7.500" ry="9.500" fill="#1b1530">
            <animate attributeName="ry" values="9.500;9.500;1;9.500;9.500" keyTimes="0;0.9;0.94;0.98;1" dur="4.6s" repeatCount="indefinite"/>
          </ellipse>
          <ellipse cx="173" cy="126" rx="7.500" ry="9.500" fill="#1b1530">
            <animate attributeName="ry" values="9.500;9.500;1;9.500;9.500" keyTimes="0;0.9;0.94;0.98;1" dur="4.6s" repeatCount="indefinite"/>
          </ellipse>
          <g fill="#fff">
            <circle cx="129.500" cy="122" r="2.800"/>
            <circle cx="175.500" cy="122" r="2.800"/>
            <animate attributeName="opacity" values="1;1;0;1;1" keyTimes="0;0.9;0.94;0.98;1" dur="4.6s" repeatCount="indefinite"/>
          </g>
          <circle cx="109" cy="144" r="9" fill="#ec4899" opacity=".35"/>
          <circle cx="191" cy="144" r="9" fill="#ec4899" opacity=".35"/>
          <path d="M144 138h12l-6 7Z" fill="#ec4899" stroke="#1b1530" stroke-width="2"/>
          <path d="M150 145q-6 9-13 3M150 145q6 9 13 3" stroke="#1b1530" stroke-width="3"/>
          <path d="M98 132H74M99 141l-23 7M202 132h24M201 141l23 7" stroke="#1b1530" stroke-width="2"/>
        </g>
      </g>

      <rect x="82" y="218" width="136" height="76" rx="9" fill="#1e1b2e" stroke="#1b1530" stroke-width="3"/>
      <text x="150" y="264" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" font-weight="700" font-size="24" fill="#38bdf8">&lt;/&gt;
        <animate attributeName="opacity" values=".45;1;.45" dur="2s" repeatCount="indefinite"/>
      </text>
      <rect x="64" y="289" width="172" height="11" rx="5.500" fill="#2c2742" stroke="#1b1530" stroke-width="3"/>
    </svg>
  </g>
</svg>
